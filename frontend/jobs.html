<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs · log-analyzer</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<header class="app-header">
  <a href="jobs.html" class="brand">log-analyzer</a>
  <div class="flex-row">
    <span class="user-info" id="userInfo"></span>
    <a href="#" id="logoutBtn" class="text-link">Sign out</a>
  </div>
</header>

<main class="container">
  <div class="page-header">
    <h1>Uploads</h1>
  </div>

  <div class="upload-zone" id="uploadZone">
    <p><strong>Drop a log file here</strong> or click to browse</p>
    <p class="text-muted" style="margin-top: 4px;">.log or .txt, up to 500 MB</p>
    <input type="file" id="fileInput" accept=".log,.txt">
    <div class="upload-progress" id="uploadProgress"></div>
  </div>

  <div style="height: 24px;"></div>

  <div class="table-wrapper">
    <table>
      <thead>
      <tr>
        <th>Job ID</th>
        <th>File</th>
        <th>Status</th>
        <th>Lines</th>
        <th>Uploaded</th>
      </tr>
      </thead>
      <tbody id="jobsTbody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display: none;">
      No uploads yet. Drop a file above to begin.
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/jobs.js"></script>

</body>
</html>
